<!-- Слайд истории компании: год, заголовок и текст из админки, фото.
     Параметры: year, title, text, img (без расширения) -->
<div class="swiper-slide history-slide">
  <p class="history-slide__year">@@year</p>
  <div class="rich-text history-slide__text">
    <h3>@@title</h3>
    <p>@@text</p>
  </div>
  <img class="history-slide__photo" src="assets/img/@@img.webp" width="270" height="151" alt="" loading="lazy">
</div>
