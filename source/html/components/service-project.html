<!-- Слайд «Реализованные проекты по услуге». Параметры: num, title, customer, img, text, power, powerUnit, area, href -->
<article class="swiper-slide service-project">
  <div class="service-project__head">
    <h3 class="service-project__title"><a href="@@href">@@title</a></h3>
    <dl class="service-project__customer">
      <dt>Заказчик</dt>
      <dd>@@customer</dd>
    </dl>
  </div>
  <div class="service-project__photo">
    <img class="service-project__num" src="assets/img/number-@@num.webp" width="244" height="337" alt="" aria-hidden="true">
    <img class="service-project__img" src="assets/img/@@img.webp" width="334" height="251" alt="" loading="lazy">
  </div>
  <div class="service-project__info">
    <p class="service-project__text">@@text</p>
    <dl class="service-project__params">
      <div>
        <dt>Мощность</dt>
        <dd>@@power<span>@@powerUnit</span></dd>
      </div>
      <div>
        <dt>Площадь</dt>
        <dd>@@area<span>м²</span></dd>
      </div>
    </dl>
  </div>
</article>
