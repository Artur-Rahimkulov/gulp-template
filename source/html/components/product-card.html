<article class="product-card">
	<div class="product-card__media">
		<span class="product-card__corner product-card__corner--start" aria-hidden="true"></span>
		<span class="product-card__corner product-card__corner--end" aria-hidden="true"></span>

		<img class="product-card__image" src="assets/img/server-dell.jpg" width="240" height="45" alt="Сервер HP ProLiant DL380 Gen10 (2U)" loading="lazy">

		<div class="product-card__badges">
			<span class="badge badge--stock">Склад</span>
		</div>
	</div>

	<div class="product-card__body">
		<div class="product-card__info">
			<p class="product-card__price">от 226 062 ₽</p>

			<div class="product-card__summary">
				<h3 class="product-card__title">
					<a class="product-card__link" href="#">Сервер HP ProLiant DL380 Gen10 (2U)</a>
				</h3>

				<ul class="product-card__specs spec-list">
					<li class="spec-list__item">Rack 2U</li>
					<li class="spec-list__item">2 х Intel Xeon 2Gen</li>
					<li class="spec-list__item">24 х DDR4 DIMM</li>
					<li class="spec-list__item">12 x LFF / 24 x SFF</li>
					<li class="spec-list__item">SAS/SATA/SSD/NVMe</li>
					<li class="spec-list__item spec-list__item--extra">2 PSU</li>
					<li class="spec-list__item spec-list__item--extra spec-list__item--hint">
						До 5 лет гарантии
						<button class="spec-list__hint" type="button" aria-label="Подробнее об условиях гарантии">?</button>
					</li>
				</ul>
			</div>
		</div>

		<div class="product-card__actions">
			<p class="product-card__partnometer">Партнометр: <span>P22094-421</span></p>

			<div class="product-card__buttons">
				<div class="product-card__actions-row">
					<button class="btn btn--soft btn--lg btn--icon-left product-card__buy" type="button">
						<span class="btn__icon">
							<svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 11L14 20M19 11L15 4M2 11H22M3.5 11L5.1 18.4C5.1935 18.8586 5.44485 19.2698 5.81028 19.5621C6.17572 19.8545 6.63211 20.0094 7.1 20H16.9C17.3679 20.0094 17.8243 19.8545 18.1897 19.5621C18.5552 19.2698 18.8065 18.8586 18.9 18.4L20.6 11M4.5 15.5H19.5M5 11L9 4M9 11L10 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
						</span>
						<span class="btn__label">Купить в 1 клик</span>
					</button>

					<button class="btn btn--outlined btn--square product-card__cart" type="button" aria-label="Добавить в корзину">
						<svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 3L2.26491 3.0883C3.58495 3.52832 4.24497 3.74832 4.62248 4.2721C5 4.79587 5 5.49159 5 6.88304V9.5C5 12.3284 5 13.7426 5.87868 14.6213C6.75736 15.5 8.17157 15.5 11 15.5H19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M7.5 18C8.32843 18 9 18.6716 9 19.5C9 20.3284 8.32843 21 7.5 21C6.67157 21 6 20.3284 6 19.5C6 18.6716 6.67157 18 7.5 18Z" stroke="currentColor" stroke-width="1.6"/><path d="M16.5 18.0001C17.3284 18.0001 18 18.6716 18 19.5001C18 20.3285 17.3284 21.0001 16.5 21.0001C15.6716 21.0001 15 20.3285 15 19.5001C15 18.6716 15.6716 18.0001 16.5 18.0001Z" stroke="currentColor" stroke-width="1.6"/><path d="M5 6H16.4504C18.5054 6 19.5328 6 19.9775 6.67426C20.4221 7.34853 20.0173 8.29294 19.2078 10.1818L18.7792 11.1818C18.4013 12.0636 18.2123 12.5045 17.8366 12.7523C17.4609 13 16.9812 13 16.0218 13H5" stroke="currentColor" stroke-width="1.6"/></svg>
					</button>
				</div>

				<button class="btn btn--primary btn--lg btn--icon-left btn--block" type="button">
					<span class="btn__icon">
						<svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M9.23431 5.22781C9.54673 4.92406 10.0533 4.92406 10.3657 5.22781L16.7657 11.45C17.0781 11.7538 17.0781 12.2462 16.7657 12.55L10.3657 18.7722C10.0533 19.0759 9.54673 19.0759 9.23431 18.7722C8.9219 18.4685 8.9219 17.976 9.23431 17.6723L15.0686 12L9.23431 6.32775C8.9219 6.02401 8.9219 5.53155 9.23431 5.22781Z" fill="currentColor"/></svg>
					</span>
					<span class="btn__label">Сконфигурировать</span>
				</button>
			</div>
		</div>
	</div>
</article>
