<!-- Форма «Не нашли подходящую вакансию?» (синяя, с полями-подчёркиваниями) -->
<form class="vacancy-form" action="#" method="post" novalidate>
  <div class="rich-text vacancy-form__text">
    <h2>Не&nbsp;нашли подходящую вакансию?</h2>
    <p>Заполните форму, и&nbsp;наш&nbsp;специалист свяжется с&nbsp;вами для&nbsp;уточнения деталей</p>
  </div>
  <div class="vacancy-form__fields">
    <div class="vacancy-form__field" data-form-group>
      <input class="vacancy-form__input" type="text" name="name" placeholder="Имя*" aria-label="Имя" required data-type="name" autocomplete="name" data-required-message="Заполните поле" data-error-message="Введите корректное имя">
    </div>
    <div class="vacancy-form__field" data-form-group>
      <input class="vacancy-form__input" type="tel" name="phone" placeholder="+7 (___) ___-__-__" aria-label="Телефон" required data-type="phone" autocomplete="tel" data-required-message="Заполните поле" data-error-message="Некорректный телефон">
    </div>
    <div class="vacancy-form__field" data-form-group>
      <input class="vacancy-form__input" type="email" name="email" placeholder="Почта*" aria-label="Почта" required data-type="email" autocomplete="email" data-required-message="Заполните поле" data-error-message="Некорректный email">
    </div>
  </div>
  <!-- согласие: на десктопе — чекбокс, на мобильной в макете его нет (скрытое поле не проверяется, js/modules/validateForms.js) -->
  <label class="vacancy-form__consent" data-form-group-checkbox>
    <input class="vacancy-form__checkbox" type="checkbox" name="consent" required>
    <span class="vacancy-form__box" aria-hidden="true"></span>
    <span class="vacancy-form__consent-text">Нажимая на&nbsp;кнопку «Отправить заявку»<br> я&nbsp;принимаю условия <a href="policy.html" target="_blank" rel="noopener noreferrer">Политики конфиденциальности</a></span>
  </label>
  @@include("source/html/ui/button.html", {"type": "submit", "name": "Отправить заявку", "class": "btn--lg vacancy-form__btn"})
</form>
