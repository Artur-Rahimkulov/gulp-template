<!-- Модальное окно ошибки отправки формы (подключается через Bitrix) -->
<div class="modal modal--error" id="modal-error" data-modal="error" aria-hidden="true" role="dialog" aria-modal="true"
  aria-labelledby="modal-error-title">
  <div class="modal__overlay" data-modal-close></div>
  <div class="modal__dialog">
    <button class="modal__close" type="button" aria-label="Закрыть окно" data-modal-close>
      <img src="assets/svg/modal-close.svg" width="16" height="16" alt="" aria-hidden="true">
    </button>
    <div class="modal__decor" aria-hidden="true">
      <img src="assets/img/modal-decor.webp" width="277" height="316" alt="" aria-hidden="true">
    </div>
    <div class="modal__content">
      <div class="modal__head">
        <div class="modal__icon modal__icon--error">
          <img src="assets/svg/modal-error-icon.svg" width="60" height="60" alt="" aria-hidden="true">
        </div>
        <h2 class="modal__title modal__title--error" id="modal-error-title">Ошибка</h2>
      </div>
      <p class="modal__text">
        При отправке сообщения произошла ошибка. Пожалуйста, попробуйте ещё раз.
      </p>
    </div>
  </div>
</div>
