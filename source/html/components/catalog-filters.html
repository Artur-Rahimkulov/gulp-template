<div class="filters" data-accordion="multi-expand" data-filters>
	<div class="filters__bar">
		<button class="filters__bar-btn" type="button" aria-label="Назад" data-filters-close>
			<svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
		</button>
		<span class="filters__bar-title">Фильтр</span>
		<button class="filters__bar-btn" type="button" aria-label="Закрыть фильтр" data-filters-close>
			<svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
		</button>
	</div>

	<div class="filters__scroll">
		<h2 class="filters__title">Фильтр</h2>

		<div class="filters__groups">
			<div class="filters__group active" data-accordion-item>
				<button class="filters__group-btn" type="button" data-accordion-button aria-expanded="true">
					<span class="filters__group-name">Производитель</span>
					<img class="filters__group-icon" src="assets/svg/chevron-down.svg" width="16" height="16" alt="">
				</button>
				<div class="filters__group-body">
					<ul class="filters__tags">
						<li><button class="btn btn--outlined filters__tag" type="button">Hewlett Packard</button></li>
						<li><button class="btn btn--outlined filters__tag is-active" type="button">Dell</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">Lenovo</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">Acer</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">AIC</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">ASUS</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">Cisco</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button" disabled>Nerpa</button></li>
					</ul>
					<button class="filters__more" type="button">+ Показать еще</button>
				</div>
			</div>

			<div class="filters__group active" data-accordion-item>
				<button class="filters__group-btn" type="button" data-accordion-button aria-expanded="true">
					<span class="filters__group-name">Наличие</span>
					<img class="filters__group-icon" src="assets/svg/chevron-down.svg" width="16" height="16" alt="">
				</button>
				<div class="filters__group-body">
					<ul class="filters__tags">
						<li><button class="btn btn--outlined filters__tag" type="button">В наличии</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">Под заказ</button></li>
					</ul>
				</div>
			</div>

			<div class="filters__group active" data-accordion-item>
				<button class="filters__group-btn" type="button" data-accordion-button aria-expanded="true">
					<span class="filters__group-name">Формфактор</span>
					<img class="filters__group-icon" src="assets/svg/chevron-down.svg" width="16" height="16" alt="">
				</button>
				<div class="filters__group-body">
					<ul class="filters__tags">
						<li><button class="btn btn--outlined filters__tag" type="button">1U</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">2U</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">3U</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">4U</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">12U</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">Mid Tower</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">Mini Tower</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">Tower</button></li>
					</ul>
				</div>
			</div>

			<div class="filters__group" data-accordion-item>
				<button class="filters__group-btn" type="button" data-accordion-button aria-expanded="false">
					<span class="filters__group-name">Модель</span>
					<img class="filters__group-icon" src="assets/svg/chevron-down.svg" width="16" height="16" alt="">
				</button>
				<div class="filters__group-body">
					<ul class="filters__tags">
						<li><button class="btn btn--outlined filters__tag" type="button">PowerEdge R650</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">ProLiant DL380</button></li>
					</ul>
				</div>
			</div>

			<div class="filters__group" data-accordion-item>
				<button class="filters__group-btn" type="button" data-accordion-button aria-expanded="false">
					<span class="filters__group-name">Тип процессора</span>
					<img class="filters__group-icon" src="assets/svg/chevron-down.svg" width="16" height="16" alt="">
				</button>
				<div class="filters__group-body">
					<ul class="filters__tags">
						<li><button class="btn btn--outlined filters__tag" type="button">Intel Xeon</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">AMD EPYC</button></li>
					</ul>
				</div>
			</div>

			<div class="filters__group" data-accordion-item>
				<button class="filters__group-btn" type="button" data-accordion-button aria-expanded="false">
					<span class="filters__group-name">Кол-во процессоров</span>
					<img class="filters__group-icon" src="assets/svg/chevron-down.svg" width="16" height="16" alt="">
				</button>
				<div class="filters__group-body">
					<ul class="filters__tags">
						<li><button class="btn btn--outlined filters__tag" type="button">1</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">2</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">4</button></li>
					</ul>
				</div>
			</div>

			<div class="filters__group" data-accordion-item>
				<button class="filters__group-btn" type="button" data-accordion-button aria-expanded="false">
					<span class="filters__group-name">Оперативная память</span>
					<img class="filters__group-icon" src="assets/svg/chevron-down.svg" width="16" height="16" alt="">
				</button>
				<div class="filters__group-body">
					<ul class="filters__tags">
						<li><button class="btn btn--outlined filters__tag" type="button">32 Gb</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">64 Gb</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">128 Gb</button></li>
					</ul>
				</div>
			</div>

			<div class="filters__group" data-accordion-item>
				<button class="filters__group-btn" type="button" data-accordion-button aria-expanded="false">
					<span class="filters__group-name">Max кол-во дисков</span>
					<img class="filters__group-icon" src="assets/svg/chevron-down.svg" width="16" height="16" alt="">
				</button>
				<div class="filters__group-body">
					<ul class="filters__tags">
						<li><button class="btn btn--outlined filters__tag" type="button">8</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">12</button></li>
						<li><button class="btn btn--outlined filters__tag" type="button">24</button></li>
					</ul>
				</div>
			</div>
		</div>
	</div>

	<div class="filters__actions">
		<button class="btn btn--outlined btn--lg btn--block" type="button">Сбросить</button>
		<button class="btn btn--soft btn--lg btn--block" type="button" data-filters-close>Показать</button>
	</div>
</div>
