<div class="filters" data-accordion="multi-expand">
	<div class="filters__head">
		<h2 class="filters__title">Фильтр</h2>
		<button class="filters__close" type="button" aria-label="Закрыть фильтр" data-filters-close>
			<img src="assets/svg/close.svg" width="20" height="20" alt="">
		</button>
	</div>

	<div class="filters__group active" data-accordion-item>
		<button class="filters__group-btn" type="button" data-accordion-button aria-expanded="true">
			<span class="filters__group-name">Производитель</span>
			<img class="filters__group-icon" src="assets/svg/chevron-down.svg" width="16" height="16" alt="">
		</button>
		<div class="filters__group-body">
			<ul class="filters__tags">
				<li><button class="btn btn--outlined" type="button">Hewlett Packard</button></li>
				<li><button class="btn btn--outlined is-active" type="button">Dell</button></li>
				<li><button class="btn btn--outlined" type="button">Lenovo</button></li>
				<li><button class="btn btn--outlined" type="button">Acer</button></li>
				<li><button class="btn btn--outlined" type="button">AIC</button></li>
				<li><button class="btn btn--outlined" type="button">ASUS</button></li>
				<li><button class="btn btn--outlined" type="button">Cisco</button></li>
				<li><button class="btn btn--outlined" type="button" disabled>Nerpa</button></li>
			</ul>
			<button class="filters__more" type="button">+ Показать еще</button>
		</div>
	</div>

	<div class="filters__group active" data-accordion-item>
		<button class="filters__group-btn" type="button" data-accordion-button aria-expanded="true">
			<span class="filters__group-name">Наличие</span>
			<img class="filters__group-icon" src="assets/svg/chevron-down.svg" width="16" height="16" alt="">
		</button>
		<div class="filters__group-body">
			<ul class="filters__tags">
				<li><button class="btn btn--outlined" type="button">В наличии</button></li>
				<li><button class="btn btn--outlined" type="button">Под заказ</button></li>
			</ul>
		</div>
	</div>

	<div class="filters__group active" data-accordion-item>
		<button class="filters__group-btn" type="button" data-accordion-button aria-expanded="true">
			<span class="filters__group-name">Формфактор</span>
			<img class="filters__group-icon" src="assets/svg/chevron-down.svg" width="16" height="16" alt="">
		</button>
		<div class="filters__group-body">
			<ul class="filters__tags">
				<li><button class="btn btn--outlined" type="button">1U</button></li>
				<li><button class="btn btn--outlined" type="button">2U</button></li>
				<li><button class="btn btn--outlined" type="button">3U</button></li>
				<li><button class="btn btn--outlined" type="button">4U</button></li>
				<li><button class="btn btn--outlined" type="button">12U</button></li>
				<li><button class="btn btn--outlined" type="button">Mid Tower</button></li>
				<li><button class="btn btn--outlined" type="button">Mini Tower</button></li>
				<li><button class="btn btn--outlined" type="button">Tower</button></li>
			</ul>
		</div>
	</div>

	<div class="filters__group" data-accordion-item>
		<button class="filters__group-btn" type="button" data-accordion-button aria-expanded="false">
			<span class="filters__group-name">Модель</span>
			<img class="filters__group-icon" src="assets/svg/chevron-down.svg" width="16" height="16" alt="">
		</button>
		<div class="filters__group-body">
			<ul class="filters__tags">
				<li><button class="btn btn--outlined" type="button">PowerEdge R650</button></li>
				<li><button class="btn btn--outlined" type="button">ProLiant DL380</button></li>
			</ul>
		</div>
	</div>

	<div class="filters__group" data-accordion-item>
		<button class="filters__group-btn" type="button" data-accordion-button aria-expanded="false">
			<span class="filters__group-name">Тип процессора</span>
			<img class="filters__group-icon" src="assets/svg/chevron-down.svg" width="16" height="16" alt="">
		</button>
		<div class="filters__group-body">
			<ul class="filters__tags">
				<li><button class="btn btn--outlined" type="button">Intel Xeon</button></li>
				<li><button class="btn btn--outlined" type="button">AMD EPYC</button></li>
			</ul>
		</div>
	</div>

	<div class="filters__group" data-accordion-item>
		<button class="filters__group-btn" type="button" data-accordion-button aria-expanded="false">
			<span class="filters__group-name">Кол-во процессоров</span>
			<img class="filters__group-icon" src="assets/svg/chevron-down.svg" width="16" height="16" alt="">
		</button>
		<div class="filters__group-body">
			<ul class="filters__tags">
				<li><button class="btn btn--outlined" type="button">1</button></li>
				<li><button class="btn btn--outlined" type="button">2</button></li>
				<li><button class="btn btn--outlined" type="button">4</button></li>
			</ul>
		</div>
	</div>

	<div class="filters__group" data-accordion-item>
		<button class="filters__group-btn" type="button" data-accordion-button aria-expanded="false">
			<span class="filters__group-name">Оперативная память</span>
			<img class="filters__group-icon" src="assets/svg/chevron-down.svg" width="16" height="16" alt="">
		</button>
		<div class="filters__group-body">
			<ul class="filters__tags">
				<li><button class="btn btn--outlined" type="button">32 Gb</button></li>
				<li><button class="btn btn--outlined" type="button">64 Gb</button></li>
				<li><button class="btn btn--outlined" type="button">128 Gb</button></li>
			</ul>
		</div>
	</div>

	<div class="filters__group" data-accordion-item>
		<button class="filters__group-btn" type="button" data-accordion-button aria-expanded="false">
			<span class="filters__group-name">Max кол-во дисков</span>
			<img class="filters__group-icon" src="assets/svg/chevron-down.svg" width="16" height="16" alt="">
		</button>
		<div class="filters__group-body">
			<ul class="filters__tags">
				<li><button class="btn btn--outlined" type="button">8</button></li>
				<li><button class="btn btn--outlined" type="button">12</button></li>
				<li><button class="btn btn--outlined" type="button">24</button></li>
			</ul>
		</div>
	</div>
</div>
