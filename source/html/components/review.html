<!-- Карточка отзыва. Параметры: letter (первая буква имени), name, post, text -->
<article class="review swiper-slide">
  <div class="review__head">
    <span class="review__avatar" aria-hidden="true">@@letter</span>
    <div>
      <p class="review__name">@@name</p>
      <p class="review__post">@@post</p>
    </div>
  </div>
  <div class="rich-text review__text">
    <p>@@text</p>
  </div>
</article>
