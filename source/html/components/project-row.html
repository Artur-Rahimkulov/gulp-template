<!-- Проект в списке «Проекты»: фото, описание и характеристики. Каждый второй — зеркально (фото слева) и на светлой полосе, это делает css.
     Проект — целый «слот» макета со своими отступами и декором, поэтому их можно добавлять сколько угодно.
     Параметры: title, text, img, href, category (для фильтра), customerLabel («Заказчик» / «Застройщик»), customer;
     logo, logoWidth, logoHeight — логотип заказчика, если передан, выводится вместо характеристик;
     power, powerUnit, area — характеристики (без логотипа) -->
<article class="project-row" data-category="@@category" data-project-href="@@href">
  <!-- фон и декор проекта: светлая полоса, плашки-призраки и линии — свои у нечётных и чётных -->
  <div class="project-row__decor" aria-hidden="true"></div>
  <div class="project-row__photo">
    <img src="assets/img/@@img.webp" width="519" height="301" alt="" loading="lazy">
  </div>
  <div class="project-row__main">
    <div class="project-row__text">
      <h3 class="project-row__title"><a href="@@href">@@title</a></h3>
      <!-- описание из админки: внутри только теги -->
      <div class="rich-text project-row__desc">
        <p>@@text</p>
      </div>
    </div>
    <a class="project-link project-row__link" href="@@href" tabindex="-1" aria-hidden="true">
      <span class="project-link__name">Подробнее о&nbsp;проекте</span>
      <span class="project-link__arrow"></span>
    </a>
  </div>
  <div class="project-row__info">
    @@if (context.logo) {
    <div class="project-row__logo">
      <img src="assets/img/@@logo.webp" width="@@logoWidth" height="@@logoHeight" alt="@@customer" loading="lazy">
    </div>
    }
    @@if (!context.logo) {
    <dl class="project-row__params">
      <div>
        <dt>Мощность</dt>
        <dd>@@power<span>@@powerUnit</span></dd>
      </div>
      <div>
        <dt>Площадь</dt>
        <dd>@@area<span>м²</span></dd>
      </div>
    </dl>
    }
    <dl class="project-row__customer">
      <dt>@@customerLabel</dt>
      <dd>@@customer</dd>
    </dl>
  </div>
</article>
