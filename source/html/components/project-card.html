<!-- Слайд похожего проекта. Параметры: title, customer, img, text, power, area, term, termUnit, href -->
<article class="project-card swiper-slide">
  <h3 class="project-card__title">@@title</h3>
  <dl class="project-card__customer">
    <dt>Заказчик</dt>
    <dd>@@customer</dd>
  </dl>
  <div class="project-card__photo">
    <img src="assets/img/@@img.webp" width="330" height="261" alt="" loading="lazy">
  </div>
  <div class="project-card__body">
    <div class="rich-text project-card__text">
      <p>@@text</p>
    </div>
    <dl class="project-card__params">
      <div>
        <dt>Мощность</dt>
        <dd>@@power <span>МВт</span></dd>
      </div>
      <div>
        <dt>Площадь</dt>
        <dd>@@area <span>м²</span></dd>
      </div>
      <div>
        <dt>Срок</dt>
        <dd>@@term <span>@@termUnit</span></dd>
      </div>
    </dl>
    @@include("source/html/ui/button.html", {"tag": "a", "href": "@@href", "name": "Подробнее", "class": "btn--lg project-card__btn"})
  </div>
</article>
