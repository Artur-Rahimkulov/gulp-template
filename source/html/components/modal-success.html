<!-- Модальное окно успешной отправки формы (подключается через Bitrix) -->
<div class="modal modal--success" id="modal-success" data-modal="success" aria-hidden="true" role="dialog"
  aria-modal="true" aria-labelledby="modal-success-title">
  <div class="modal__overlay" data-modal-close></div>
  <div class="modal__dialog">
    <button class="modal__close" type="button" aria-label="Закрыть окно" data-modal-close>
      <img src="assets/svg/modal-close.svg" width="16" height="16" alt="" aria-hidden="true">
    </button>
    <div class="modal__decor" aria-hidden="true">
      <img src="assets/img/modal-decor.webp" width="307" height="350" alt="" aria-hidden="true">
    </div>
    <div class="modal__content">
      <div class="modal__head">
        <div class="modal__icon modal__icon--success">
          <img src="assets/svg/modal-success-icon.svg" width="60" height="60" alt="" aria-hidden="true">
        </div>
        <h2 class="modal__title modal__title--success" id="modal-success-title">Ваша заявка отправлена</h2>
      </div>
      <p class="modal__text">
        Наши специалисты свяжутся с&nbsp;вами в&nbsp;ближайшее время.
      </p>
    </div>
  </div>
</div>
