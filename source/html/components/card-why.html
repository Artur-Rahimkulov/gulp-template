<!-- Скошенная карточка «Почему выбирают» (главная).
     Параметры: num (номер 01…05 — картинка why-<num>.png), numWidth, numHeight, icon (why-icon-N.png), iconWidth, iconHeight, title, text -->
<article class="card-why">
  <img class="card-why__num" src="assets/img/why-@@num.webp" width="@@numWidth" height="@@numHeight" alt="@@num.">
  <span class="card-why__icon">
    <img src="assets/img/@@icon.webp" width="@@iconWidth" height="@@iconHeight" alt="" aria-hidden="true">
  </span>
  <h3 class="card-why__title">@@title</h3>
  <p class="card-why__text">@@text</p>
</article>
