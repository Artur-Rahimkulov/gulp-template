<!-- Карточка новости. Параметры: img (без расширения, из assets/img), rubric, title, date, text, href -->
<article class="card-news">
  <div class="card-news__media">
    <img src="assets/img/@@img.webp" width="447" height="279" alt="" loading="lazy">
    <span class="card-news__rubric">@@rubric</span>
  </div>
  <div class="card-news__body">
    <div class="card-news__head">
      <h3 class="card-news__title">@@title</h3>
      <time class="card-news__date">@@date</time>
    </div>
    <div class="rich-text text-card card-news__text">
      <p>@@text</p>
    </div>
    <a class="link card-news__link" href="@@href">Подробнее</a>
  </div>
</article>
