<!-- Карточка «Ценности». Параметры: number, icon (svg из assets/svg), title, text -->
<article class="card-value">
  <p class="card-value__number">@@number</p>
  @@include("source/html/ui/icon-plate.html", {"icon": "@@icon", "class": "card-value__icon"})
  <h3 class="card-value__title">@@title</h3>
  <div class="rich-text card-value__text text-card">
    <p>@@text</p>
  </div>
</article>
