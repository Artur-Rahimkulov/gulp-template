<!-- Карточка «Корпоративная жизнь». Параметры: img (без расширения), icon (svg без расширения), title, text -->
<article class="card-life">
  <div class="card-life__photo">
    <img src="assets/img/@@img.webp" width="683" height="384" alt="" loading="lazy">
  </div>
  <div class="card-life__body">
    <span class="card-life__icon"><img src="assets/svg/@@icon.svg" width="22" height="22" alt=""></span>
    <div>
      <h3 class="card-life__title">@@title</h3>
      <div class="rich-text card-life__text">
        <p>@@text</p>
      </div>
    </div>
  </div>
</article>
