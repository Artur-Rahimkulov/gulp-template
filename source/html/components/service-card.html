<!-- Карточка услуги «Комплекс работ»: синяя плашка (фон на CSS + HTML + SVG), иллюстрация (PNG/WebP), название и стрелка. Вся карточка — ссылка.
     Параметры: title, href, img, imgWidth, imgHeight, mod (положение иллюстрации: gas | motor | light) -->
<a class="service-card @@if (context.mod) {service-card--@@mod}" href="@@href">
  <span class="service-card__bg" aria-hidden="true">
    <svg class="service-card__decor" viewBox="0 0 435 329" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <path d="M173 54H435V329H72L173 54Z" fill="rgba(0, 20, 60, 0.05)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    </svg>
  </span>
  @@if (context.img) {
  <img class="service-card__img" src="assets/img/@@img.webp" @@if (context.imgWidth) {width="@@imgWidth"} @@if (context.imgHeight) {height="@@imgHeight"} alt="" loading="lazy">
  }
  <span class="service-card__title">@@title</span>
  <span class="service-card__arrow" aria-hidden="true"></span>
</a>
