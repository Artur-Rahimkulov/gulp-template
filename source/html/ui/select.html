<div
  class="select @@if(context.class){@@class}"
  @@if(context.id){id="@@id" }
  data-select="select"
  @@if(context.paramsSearch){data-params-search="@@paramsSearch" }
  data-form-group
>
	@@if(context.label){
	<label class="select__label">@@label</label>
	}
	<div class="select__wrapper">
		<div class="select__button" data-select="button">
			<div class="select__title">
				<span>@@button</span>
				<svg class="icon" width="20" height="20" aria-hidden="true" focusable="false"><use href="assets/svg/sprite.svg#icon-chevron-down"></use></svg>
			</div>
			<input class="form-control" type="text" @@if(context.name){name="@@name" } @@if(context.value){value="@@value" } @@if(context.required) {required}>
		</div>
		<div class="select__options" data-select="options">
			<ul class="select__list" @@if(context.onclick){onclick="@@onclick" }>
				@@if (context.selected) {
				<li class="select__option _selected" data-value="@@value" data-select="option"><span>@@button</span></li>
				}
				@@for(let i = 0; i < selectOptions.length; i++) { <li class="select__option" data-value="`+selectOptions[i].value+`" data-select="option"><span>`+selectOptions[i].text+`</span></li>
				}
			</ul>
		</div>
	</div>
</div>
